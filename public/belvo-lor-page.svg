<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 595 842" width="100%" height="100%" style="background-color: #ffffff;">
  <!-- Left Purple Accent Bars -->
  <!-- Top corner block -->
  <rect x="0" y="0" width="28" height="64" fill="#6B21A8" />
  <!-- Long vertical stripe -->
  <rect x="0" y="125" width="28" height="660" fill="#6B21A8" />

  <!-- Top Header -->
  <g transform="translate(60, 48)">
    <!-- Belvo Stylized Clover/Loops Glyph -->
    <g transform="translate(0, 0)">
      <path d="M16 6 C12 2, 6 2, 3 6 C0 10, 1 16, 6 19 C1 22, 0 28, 3 32 C6 36, 12 36, 16 32 C20 36, 26 36, 29 32 C32 28, 31 22, 26 19 C31 16, 32 10, 29 6 C26 2, 20 2, 16 6 Z"
            fill="none" stroke="#6B21A8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="19" r="2.2" fill="#6B21A8" />
      <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" fill="#6B21A8" text-anchor="middle" letter-spacing="1.2">BELVO</text>
    </g>

    <!-- Belvo Company Text -->
    <text x="44" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#3B0764" letter-spacing="0.5">BELVO COMPANY</text>

    <!-- Date top right -->
    <text x="475" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#475569" text-anchor="end">22-09-2026</text>
  </g>

  <!-- Recipient Info Block -->
  <g transform="translate(60, 165)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#1E293B">
    <text x="0" y="0">Poosala Lokesh</text>
    <text x="0" y="19">Web Developer Intern</text>
    <text x="0" y="38">Belvo Company</text>
    <text x="0" y="57">Goregaon, Mumbai</text>
  </g>

  <!-- Salutation -->
  <text x="60" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">Dear Poosala Lokesh,</text>

  <!-- Body Text Paragraphs -->
  <g transform="translate(60, 295)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#334155">
    <text x="0" y="0">It is my pleasure to recommend you for successfully completing a 3-month internship as a Web Developer</text>
    <text x="0" y="16">at Belvo.</text>

    <text x="0" y="44">During the internship, Poosala Lokesh demonstrated a strong willingness to learn and actively participated</text>
    <text x="0" y="60">in web development activities. Throughout the internship period, they gained practical exposure to</text>
    <text x="0" y="76">website development, implementation, debugging, and improving web-based solutions.</text>

    <text x="0" y="104">Poosala Lokesh contributed to assigned projects and responsibilities while working with the development team.</text>
    <text x="0" y="120">They showed dedication, adaptability, and a professional attitude while completing assigned tasks and</text>
    <text x="0" y="136">meeting project requirements. Their ability to learn new concepts and apply technical knowledge in</text>
    <text x="0" y="152">practical situations was appreciable.</text>

    <text x="0" y="180">During their internship, Poosala Lokesh developed experience in areas such as:</text>

    <!-- Bullets -->
    <g transform="translate(10, 202)">
      <circle cx="0" cy="-3.5" r="2" fill="#6B21A8" />
      <text x="10" y="0">Web development and website implementation</text>

      <circle cx="0" cy="15.5" r="2" fill="#6B21A8" />
      <text x="10" y="19">Front-end development and responsive design</text>

      <circle cx="0" cy="34.5" r="2" fill="#6B21A8" />
      <text x="10" y="38">Debugging and resolving technical issues</text>

      <circle cx="0" cy="53.5" r="2" fill="#6B21A8" />
      <text x="10" y="57">Understanding project requirements and development workflows</text>

      <circle cx="0" cy="72.5" r="2" fill="#6B21A8" />
      <text x="10" y="76">Testing and improving web pages and features</text>

      <circle cx="0" cy="91.5" r="2" fill="#6B21A8" />
      <text x="10" y="95">Collaborating with team members on development tasks</text>
    </g>

    <text x="0" y="324">Poosala Lokesh successfully completed the 3-month internship program at Belvo and demonstrated</text>
    <text x="0" y="340">consistent commitment throughout the internship. We appreciate their contributions and wish them</text>
    <text x="0" y="356">continued success in their academic and professional career.</text>

    <text x="0" y="384">I am pleased to recommend Poosala Lokesh for future opportunities in the field of Web Development and</text>
    <text x="0" y="400">related areas.</text>
  </g>

  <!-- Signature Section -->
  <g transform="translate(370, 720)">
    <!-- Fluid Cursive Handwritten Signature of Hrishikesh -->
    <g transform="translate(0, -60)">
      <path d="M 10 12 L 10 60 M 10 38 Q 24 34, 36 34 M 34 16 L 34 58 M 34 38 Q 44 30, 54 40 T 62 44 M 62 34 L 62 58 M 65 28 C 65 26, 68 26, 68 28 M 69 48 Q 78 38, 86 54 M 88 34 L 88 58 M 91 28 C 91 26, 94 26, 94 28 M 98 48 Q 108 38, 116 54 M 118 16 L 118 58 Q 126 40, 134 58 M 138 48 Q 148 40, 156 54 M 160 50 Q 168 38, 176 54 M 180 16 L 180 66 Q 190 40, 204 58"
            fill="none" stroke="#0F172A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 8 62 Q 50 56, 130 60 T 215 58"
            fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Signatory Name and Title -->
    <text x="140" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A" text-anchor="middle">Hrishikesh Mishra</text>
    <text x="140" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#475569" text-anchor="middle">CEO, Belvo</text>
  </g>

  <!-- Bottom Lavender Contact Bar -->
  <g transform="translate(0, 796)">
    <rect x="0" y="0" width="595" height="46" fill="#F3E8FF" />

    <!-- Phone -->
    <g transform="translate(60, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0F172A">
      <path d="M2.5 0.5 C1.5 0.5, 0.5 1.5, 0.5 2.5 C0.5 8, 4.5 12, 10 12 C11 12, 12 11, 12 10 L9.8 7.8 C9.4 7.4, 8.8 7.4, 8.4 7.8 L7.4 8.8 C5.4 7.8, 4.2 6.6, 3.2 4.6 L4.2 3.6 C4.6 3.2, 4.6 2.6, 4.2 2.2 L2.5 0.5 Z" fill="#0F172A" />
      <text x="18" y="-1">+918928466820</text>
    </g>

    <!-- Email -->
    <g transform="translate(230, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0F172A">
      <path d="M1 1 L13 1 C13.5 1, 14 1.5, 14 2 L14 10 C14 10.5, 13.5 11, 13 11 L1 11 C0.5 11, 0 10.5, 0 10 L0 2 C0 1.5, 0.5 1, 1 1 Z M1.5 2.5 L7 6.5 L12.5 2.5" fill="none" stroke="#0F172A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="20" y="-1">contact.belvo@gmail.com</text>
    </g>

    <!-- Location -->
    <g transform="translate(430, 28)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#0F172A">
      <path d="M4.5 0 C2 0, 0 2, 0 4.5 C0 7.8, 4.5 12, 4.5 12 C4.5 12, 9 7.8, 9 4.5 C9 2, 7 0, 4.5 0 Z M4.5 6 C3.7 6, 3 5.3, 3 4.5 C3 3.7, 3.7 3, 4.5 3 C5.3 3, 6 3.7, 6 4.5 C6 5.3, 5.3 6, 4.5 6 Z" fill="#0F172A" />
      <text x="15" y="-1">Goregaon, Mumbai</text>
    </g>
  </g>
</svg>
